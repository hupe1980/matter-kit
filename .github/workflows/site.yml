name: Site

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/site.yml"]
  pull_request:
    paths: ["site/**", ".github/workflows/site.yml"]
  workflow_dispatch:

# Pinned: a site generator that silently changes its output is a site that breaks on a day
# nobody touched it.
env:
  ZOLA_VERSION: "0.23.4"

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Zola
        run: |
          curl -sSfL "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C /usr/local/bin zola
      # `--drafts` off, warnings fatal: a dead internal link fails the build rather than
      # shipping a 404 nobody clicks until a reader does.
      - run: zola --root site build
      # External links are checked but not gating: docs.rs 404s until the crate is published,
      # and a third-party outage is not a reason to fail a pull request.
      - run: zola --root site check || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/public

  deploy:
    name: Deploy
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
