name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # The fuzzers want wall-clock time, not a pull request.
    - cron: "23 4 * * *"
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --features std
      # The default build is the one a device ships: no_std, no allocation. Its tests are
      # the ones that must not quietly depend on `std` having been linked by something
      # else in the feature matrix.
      - run: cargo test --no-default-features

  features:
    name: Feature powerset ${{ matrix.partition }}/4
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-hack
      # Features are additive by design. A combination that fails to build is a feature that
      # is not, and the only way to find out is to try them all.
      # `log` and `defmt` are mutually exclusive in practice (see the manifest), so pairing
      # them would double every other combination for a pair no device ships.
      #
      # `default` is excluded because it is `["rustcrypto"]` and nothing else, so every
      # combination containing it resolves to one already in the list with `rustcrypto` named
      # directly. Dropping it removes 96 duplicate compilations of 288 and no coverage: the
      # default build is what every other job here builds anyway.
      #
      # The remaining 192 are split four ways rather than shortened. `--depth 2` would cut them
      # to 34 and would still catch most cfg mistakes — a missing gate usually needs one feature
      # off and one on — but this crate has items gated on a *conjunction*
      # (`all(rustcrypto, provisional)`), and those need three names in play before anything
      # can be wrong. Partitioning keeps the whole set and spends four runners instead of one:
      # 48 combinations each, about two minutes with the dependency cache warm.
      #
      # Deliberately *without* `--no-dev-deps`. That flag rewrites `Cargo.toml` in place for
      # the duration of the run and restores it on exit — so an interrupted run (a timeout, a
      # cancelled job, a Ctrl-C on a developer's machine) leaves a manifest with no
      # `[dev-dependencies]`, and every later `cargo test` fails with "unresolved import
      # `hex_literal`" in code nobody touched. It buys nothing here: `check` without
      # `--all-targets` does not build dev-dependencies, and the two this crate has — `hex`
      # and `hex-literal` — do not depend on `matter-kit`, so they cannot unify a feature
      # into the crate under test.
      # `--keep-going` because the interesting output of a broken powerset is *which*
      # combinations broke: stopping at the first turns one run into one bisection step.
      - run: |
          cargo hack check --feature-powerset \
            --mutually-exclusive-features log,defmt \
            --exclude-features default \
            --partition ${{ matrix.partition }}/4 \
            --keep-going

  embedded:
    name: no_std targets
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [thumbv7em-none-eabihf, riscv32imac-unknown-none-elf]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      # Building for a target with no operating system is what actually proves `no_std`:
      # a `cfg` that accidentally pulls in `std` fails here and nowhere else.
      - run: cargo build --target ${{ matrix.target }}
      - run: cargo build --target ${{ matrix.target }} --features defmt

  footprint:
    name: Footprint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
          components: llvm-tools
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: footprint
      # Building for a bare-metal target proves the crate compiles for the part. It says
      # nothing about whether it fits on one, and "fits" is the claim the README makes. So this
      # links a whole light — an nRF52840's memory, `cortex-m-rt`'s entry point, endpoint 0's
      # commissioning clusters and endpoint 1's On/Off, Identify, Groups and Scenes — and reads
      # the sections out of the image.
      #
      # The budgets in the script are regression gates rather than specification limits: a
      # change that costs ten kilobytes has to raise them deliberately.
      - run: ./footprint/run.sh --top 20

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --features std --all-targets
      - run: cargo clippy --no-default-features --all-targets
      - run: cargo doc --features std --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      # `fuzz/` is a workspace of its own, so nothing above compiles a single line of it: the
      # fuzz targets call this crate's API and drift out of step with it silently. Without this
      # the nightly Fuzz job is the only thing that notices, fifteen minutes in; here it is the
      # same compile error thirteen seconds into a pull request. `cargo check` rather than
      # `cargo fuzz build` because type-checking needs neither nightly nor a sanitizer.
      - run: cargo fmt --manifest-path fuzz/Cargo.toml --check
      - run: cargo check --manifest-path fuzz/Cargo.toml --all-targets
      # The architecture notes are not published, so a reference to one of their numbered
      # decisions in published text points at something the reader cannot open — and reads as
      # a citation, which is worse than no reference at all. They accumulate in rustdoc and in
      # `Cargo.toml` unless something greps for them.
      - name: No internal references in published text
        run: |
          if grep -rnE '\((D|R)[0-9]+(, ?(D|R)[0-9]+)*\)' \
               Cargo.toml README.md site/content src --include='*.rs' --include='*.toml' \
               --include='*.md' | grep -v 'clusters/generated'; then
            echo "::error::a concepts/ decision or risk number appears in published text"
            exit 1
          fi

  semver:
    name: Semver
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-semver-checks
      # The crate is published, so the question "is this release breaking?" has an answer that
      # is not a matter of opinion. `cargo-semver-checks` compares the public API against the
      # last version on crates.io and says which kind of bump the changes require; the policy
      # it enforces is written down under `site/content/docs/stability.md`.
      #
      # It fails when the version has not been raised far enough for what changed, which is the
      # only moment anybody would otherwise notice — after publishing.
      #
      # No `--release-type`: the manifest's version against the last published one is the
      # comparison that matters, and 0.x's rule — a minor bump is the breaking one — is
      # something the tool already knows and a flag would override.
      - run: cargo semver-checks

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Kept in step with `rust-version` in Cargo.toml. A bump is a deliberate act.
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-features

  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    # `-D warnings` is right for every other job and wrong for this one. `cargo fuzz` builds
    # with its own sanitizer and coverage `RUSTFLAGS`, appended to whatever is already in the
    # environment, and it compiles `libfuzzer-sys` and its dependencies as well as this crate —
    # so one warning in somebody else's code fails the build, and the same code is already
    # linted without warnings by the Test and Lint jobs.
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4
      # `llvm-tools-preview` is what the sanitizer runtimes and `cargo fuzz coverage` link
      # against; nightly alone leaves `cargo fuzz build` to fail later and less clearly.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview
      # `fuzz/` is a workspace of its own (see its Cargo.toml), so the default cache — which
      # keys on the workspace at the repository root — caches nothing this job builds.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      # The install is a separate step from the run, so a tool that did not land is reported
      # as a tool that did not land, rather than as `error: no such command: fuzz` from inside
      # a twenty-seven-iteration loop.
      - run: cargo fuzz --version
      # Every target built before any is run, so a compile error is a failed build rather
      # than a run that got thirteen minutes into the list before reaching the broken one.
      - run: |
          cargo fuzz build --target "$(rustc -vV | sed -n 's/^host: //p')"
      # A minute each on a pull request, to catch a regression that a new corpus entry
      # would find immediately. The nightly schedule is where they get real time.
      #
      # `--target` is passed explicitly, and it is not optional. `cargo fuzz` defaults it to
      # the triple *it* was compiled for — `current_platform`, resolved in its own build — not
      # to the host it is running on. `install-action` ships statically linked musl binaries,
      # so the default becomes `x86_64-unknown-linux-musl`: a target rustup has no std for,
      # and one that is `crt-static`, which the address sanitizer refuses outright
      # ("sanitizer is incompatible with statically linked libc"). Asking `rustc` for the host
      # is the only answer that stays right on a different runner or a different install.
      - run: |
          host="$(rustc -vV | sed -n 's/^host: //p')"
          echo "fuzzing on $host"
          for target in tlv tlv_roundtrip message pase cert case attestation x509 im dm dispatch clusters discovery subscribe chunking acl messaging btp checkin persist conformance scenes energy bdx tcp group ntl; do
            cargo fuzz run --target "$host" "$target" -- \
              -max_total_time=${{ github.event_name == 'schedule' && 600 || 60 }} \
              -rss_limit_mb=4096
          done

  interop:
    name: Interop (rs-matter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Rule 1: a test suite that only ever meets itself measures agreement, not correctness.
      # Everything under `tests/` is this crate checking its own reading of the specification;
      # the golden vectors check it against the CSA's published numbers; this checks it against
      # a *different implementation's* reading of the same sentences.
      #
      # `interop/` is its own workspace, so `rs-matter`'s 217 crates never enter this crate's
      # dependency graph, its feature powerset or its MSRV. That is also why this is a separate
      # job rather than another step in `test`.
      - run: cargo test --manifest-path interop/Cargo.toml
      - run: cargo fmt --manifest-path interop/Cargo.toml --check
      - run: cargo clippy --manifest-path interop/Cargo.toml --all-targets

  chip:
    name: Interop (CHIP SDK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The only test in the repository that meets the *reference* implementation: `chip-tool`
      # is the controller every certified Matter product is commissioned by during
      # certification, and a disagreement with it is a device that cannot be paired.
      #
      # It needs no hardware: both ends run in containers on an IPv6 Docker network. The run
      # covers the whole of §5.5 — PASE, attestation verified rather than bypassed, the CSR
      # and AddNOC, then mDNS resolution, CASE on the identity just issued, and
      # CommissioningComplete over the operational session.
      #
      # Reaching a passing run took five defects that nothing else in this repository could
      # see, because everything else has matter-kit on both ends. The image is 1.6-era and
      # also carries the SDK's 618 Python certification scripts, which `python.sh` runs.
      - run: ./interop/chip/run.sh

  chip-latest:
    name: Interop (CHIP SDK, upstream tip — advisory)
    runs-on: ubuntu-latest
    # Not a gate. `chip` above runs a pinned digest so that a red run means *this* crate
    # changed; this one runs whatever `:latest` has become, on the nightly schedule only, so
    # that an upstream move is noticed rather than absorbed. A failure here is a signal to look,
    # never a reason to block a pull request.
    if: github.event_name == 'schedule'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: CHIP_IMAGE=ghcr.io/matter-js/chip:latest ./interop/chip/run.sh

  harness:
    name: Interop (Test Harness cases)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The CSA Test Harness's own certification cases, out of the same image: 618 `TC_*.py`
      # scripts, the `matter` package they import, and the PICS files. Each one commissions the
      # device itself, so §5.5 runs in full before the first assertion.
      #
      # Only the cases known to pass are listed, and a case is added here when it passes —
      # that is how a milestone's exit criterion is actually met. `python.sh --list` enumerates
      # the rest. A skip exits non-zero, so a case that stops running cannot stay on this list.
      - run: |
          ./interop/chip/python.sh \
            TC_CGEN_2_1 TC_OPCREDS_3_1 \
            TC_ACL_2_2 TC_ACL_2_4 TC_ACL_2_6 TC_ACL_2_10 \
            TC_IDM_1_2 TC_IDM_1_4 TC_IDM_2_2 TC_IDM_2_3 TC_IDM_4_2

  generated:
    name: Generated sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The CSA data model is not vendored here — every file carries the CSA's own copyright
      # notice and is not redistributable — so the gate fetches it, shallowly, from the
      # project that publishes it.
      - name: Fetch the CSA data model
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/project-chip/connectedhomeip.git /tmp/chip
          git -C /tmp/chip sparse-checkout set data_model/1.6
      # Regenerating and diffing is what stops `src/clusters/generated/` drifting from the
      # specification it claims to be. A cluster revision that moved upstream fails here
      # rather than at a certification lab.
      - run: cargo xtask check --dm /tmp/chip/data_model/1.6

  deny:
    name: Licenses and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
