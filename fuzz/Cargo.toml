# A workspace of its own: `cargo fuzz` builds with sanitizer flags, and a member of the
# main workspace would pull `libfuzzer-sys` into every ordinary `cargo build`.
[package]
name = "matter-kit-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
# `nfc` and `paf` gate two transports; the fuzzers want them, and a fuzz build is never a
# device build, so turning them on here costs a device nothing.
matter-kit = { path = "..", features = ["nfc", "paf", "provisional"] }

[[bin]]
name = "tlv"
path = "fuzz_targets/tlv.rs"
test = false
doc = false
bench = false

