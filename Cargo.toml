[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(docsrs)'] }

[lints.clippy]
# Every number off the wire is hostile. These are denied
# crate-wide rather than per-module, because every module that will ever parse bytes is
# already here or will be, and an allow-list at the module head is a decision somebody
# has to make deliberately.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
todo = "deny"
unimplemented = "deny"

# The other half of "every number off the wire is hostile". `arithmetic_side_effects` above
# catches an overflow; these catch the quieter one — an `as` that drops the high bits with no
# word from the compiler. The manual pairing code accepted values §5.1.4.1.4 forbids for exactly
# that reason: a five-digit group holds 99999, the field is sixteen bits, and the surplus fell
# off a mask.
#
# Every deliberate cast carries `#[expect(…, reason = "…")]` naming the invariant that makes it
# safe — `expect` rather than `allow`, so a rewrite that removes the cast turns the annotation
# into a warning asking to be deleted, and no reason outlives the code it explains.
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"

