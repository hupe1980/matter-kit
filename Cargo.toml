# `fuzz/` and `interop/` are workspaces of their own. `cargo fuzz` builds the first with
# sanitizer flags, and a member here would pull `libfuzzer-sys` into every ordinary
# `cargo build`; the second depends on `rs-matter`, whose 217 crates would otherwise land in
# this crate's dependency graph, its feature powerset and its MSRV.
[workspace]
members = ["xtask"]
exclude = ["fuzz", "interop"]

[package]
name = "matter-kit"
version = "0.3.0"
authors = ["hupe1980"]
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Matter (CSA smart-home standard) protocol implementation in Rust: no_std, no-alloc, executor-agnostic"
repository = "https://github.com/hupe1980/matter-kit"
# The guides, not the source: `repository` already names the source, and cargo warns when the
# two are the same URL. This is what `site/` deploys to.
homepage = "https://hupe1980.github.io/matter-kit"
documentation = "https://docs.rs/matter-kit"
keywords = ["matter", "smart-home", "iot", "thread", "embedded"]
categories = ["network-programming", "embedded", "encoding", "no-std"]
readme = "README.md"
exclude = ["concepts/", "site/"]

[features]
# The default build is the certifiable device build: `no_std`, no allocation, UDP + MRP.
default = ["rustcrypto"]

# Allocation: the growable collections a controller on a big machine wants. Not TCP —
# `transport::tcp::Framer<N>` is a fixed-capacity buffer like every other table here.
alloc = []
# The operating system: sockets, a file-backed key-value store, `std::error::Error`.
#
# `socket2` comes with it, and only for one thing: binding the mDNS port with SO_REUSEADDR.
# `std::net` cannot set a socket option before `bind`, and `unsafe_code` is forbidden here, so
# there is no way to reach `setsockopt` without it — and without SO_REUSEADDR a node cannot
# bind 5353 on any machine already running Avahi or mDNSResponder, which is every developer's.
std = ["alloc", "dep:socket2"]

# The cryptographic backend. The cryptosuite itself is fixed by the specification —
# "There is no cryptosuite negotiation in this protocol: one version of the Message Format
# has one cryptosuite" (Core ch. 3) — so what a feature selects is the *implementation*,
# not the algorithms: software here, an accelerator or a vendor library later.
rustcrypto = [
    "dep:sha2", "dep:hmac", "dep:hkdf", "dep:pbkdf2",
    "dep:aes", "dep:ccm", "dep:ctr",
    "dep:p256", "dep:elliptic-curve", "dep:rand_core",
]

# Multi-threaded controllers. Swaps `sync::Shared`'s `RefCell` for a `std::sync::RwLock`, so a
# controller's state is `Send + Sync` and its run future can be spawned on a work-stealing
# runtime. A device never wants this: it is single-threaded by construction, and a lock turns a
# borrow bug that would have panicked at the mistake into one that waits somewhere else.
sync-mutex = ["std"]

# Core §2.13 provisional items. Never on by default: a provisional mechanism is not
# certifiable and may change in a 1.6.x revision.
provisional = []

# Wi-Fi Public Action Frame transport (Core §4.20). A hardware capability, not a protocol
# choice: PAFTP needs a chipset that can send Public Action Frames outside an association.
paf = []

# NFC transport (Core §4.21), likewise: NTL needs an NFC-A radio and an ISO-DEP stack.
nfc = []

# Logging backends. Mutually exclusive in practice; `log` wins if both are named.
log = ["dep:log"]
defmt = ["dep:defmt", "heapless/defmt"]

[dependencies]
# Fixed-capacity collections. Every table in the crate is one of these — `heapless::Vec<T, N>`
# with `N` the table's own const parameter, asserted against the specification's minima.
heapless = { version = "0.9", default-features = false }
bitflags = { version = "2.5", default-features = false }
log = { version = "0.4", default-features = false, optional = true }
defmt = { version = "1", optional = true }

# Constant-time comparison and key wiping are not optional: they are how the crate avoids
# leaking a MIC one byte at a time, and how a key stops existing when it is dropped.
subtle = { version = "2.6", default-features = false }
zeroize = { version = "1.8", default-features = false, features = ["zeroize_derive"] }

# The software cryptographic backend (feature `rustcrypto`).
sha2 = { version = "0.11", default-features = false, optional = true }
hmac = { version = "0.13", default-features = false, optional = true }
hkdf = { version = "0.13", default-features = false, optional = true }
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"], optional = true }
aes = { version = "0.9", default-features = false, optional = true }
ccm = { version = "0.6", default-features = false, optional = true }
ctr = { version = "0.10", default-features = false, optional = true }
p256 = { version = "0.14", default-features = false, features = ["arithmetic", "ecdh", "ecdsa"], optional = true }
elliptic-curve = { version = "0.14", default-features = false, features = ["sec1"], optional = true }
rand_core = { version = "0.10", default-features = false, optional = true }

# Binding the mDNS port with SO_REUSEADDR; `std` only. See the `std` feature.
socket2 = { version = "0.6", default-features = false, features = ["all"], optional = true }

[dev-dependencies]
# Test vectors only. Every one of the specification's worked examples is written as the
# specification prints it — hex — so that a transcription error is visible in the diff
# rather than hidden in a byte array nobody can read against the document.
hex = "0.4"
hex-literal = "1"

# Tests whose whole file needs a feature. `required-features` keeps the target from being built
# at all under `--no-default-features`; the rest of `tests/` gates itself with a `#![cfg(...)]`
# header, which builds an empty binary instead.
[[test]]
name = "spake2p_vectors"
required-features = ["rustcrypto"]

